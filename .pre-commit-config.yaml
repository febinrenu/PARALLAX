# pip install pre-commit && pre-commit install   (make setup does this for you)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-json
        exclude: ^web/tsconfig.*\.json$  # tsconfig allows JSONC (comments/trailing commas)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # Web hooks only touch web/ files, so they stay inert until P4.6 adds real content.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (web)
        entry: bash -c 'cd web && pnpm exec eslint "$@"' --
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx)$
      - id: prettier
        name: prettier (web)
        entry: bash -c 'cd web && pnpm exec prettier --check "$@"' --
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx|css|json|md)$
