[project]
name = "medproof"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "opencv-python-headless",
    "pydicom>=2.4",
    "scipy",
    "pydantic>=2",
    "diskcache",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "mypy"]
# CPU torch comes from https://download.pytorch.org/whl/cpu
ml = ["torch", "torchvision", "torchxrayvision"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
