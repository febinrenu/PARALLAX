[project]
name = "medproof"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "opencv-python-headless",
    "pydicom>=2.4",
    "scipy",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]
# CPU torch comes from https://download.pytorch.org/whl/cpu
ml = ["torch", "torchvision", "torchxrayvision", "transformers", "scikit-learn", "timm", "segmentation-models-pytorch", "h5py", "ultralytics"]
# needed by the context, report and second-reader modules and their tests
services = ["diskcache", "fhir.resources", "requests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
